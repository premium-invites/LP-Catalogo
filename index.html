<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d1528">
  <meta name="description" content="Descubra uma nova forma de convidar para os seus 15 anos. Veja a apresentação e escolha seu tema favorito.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Convite Premium | Convites Interativos de 15 Anos">
  <meta property="og:description" content="Experimente os modelos, escolha o seu tema e envie os detalhes da festa.">
  <meta property="og:image" content="https://premium-invites.github.io/LP-Catalogo/assets/capa-15anos.webp">
  <title>Convite Premium | Apresentação</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,600;1,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script defer src="config.js"></script>
  <script defer src="script.js"></script>
</head>
<body class="vsl-page" data-page="intro">
  <main class="vsl-screen" aria-labelledby="introTitle">
    <div class="vsl-media" id="vslMedia">
      <video id="introVideo" class="vsl-video" autoplay playsinline preload="metadata" aria-label="Apresentação em vídeo dos convites de 15 anos" hidden></video>
      <div class="vsl-fallback" id="videoFallback">
        <img src="assets/capa-15anos.webp" alt="Convite azul-marinho e dourado de 15 anos">
      </div>
    </div>
    <div class="vsl-overlay" aria-hidden="true"></div>
    <button type="button" class="vsl-tap-to-play" id="vslTapToPlay" hidden aria-label="Reproduzir apresentação com som">
      <span class="vsl-tap-icon" aria-hidden="true">▶</span>
      <span>Toque no vídeo para assistir com som</span>
    </button>

    <header class="vsl-header">
      <img class="vsl-logo" src="assets/logo-convite-premium.webp" width="94" height="76" alt="Convite Premium">

    </header>

    <div class="vsl-bottom">
      <h1 id="introTitle" class="vsl-headline">Seus 15 anos começam <em>antes da festa.</em></h1>
      <p class="vsl-summary vsl-subheadline">Descubra como um convite digital transforma o primeiro contato com os seus convidados.</p>
      <div class="vsl-actions">
        <div class="vsl-ready" role="status" aria-live="polite" id="vslStatus">Preparando vídeo…</div>
        <button type="button" class="vsl-retry" id="retryVideo" hidden>Tentar novamente ↻</button>
        <a class="btn btn-primary vsl-continue" href="catalogo.html" id="continueButton" hidden>Ver temas <span aria-hidden="true">→</span></a>
      </div>
      <div class="vsl-controls">
        <div class="vsl-progress-track" aria-hidden="true"><span id="videoProgress"></span></div>
        <div class="vsl-control-row">
          <span id="videoControlLabel">15 ANOS · CONVITE PREMIUM</span>
          <div class="vsl-control-buttons">
            <button type="button" class="video-small-button" id="playButton" hidden aria-label="Pausar vídeo">Pausar</button>
            <button type="button" class="video-small-button" id="soundButton" hidden aria-label="Silenciar vídeo">Silenciar</button>
          </div>
        </div>
      </div>
    </div>
  </main>
  <noscript><p class="noscript-warning">Ative o JavaScript para assistir à apresentação e avançar ao catálogo.</p></noscript>
</body>
</html>
